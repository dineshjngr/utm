<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Two WhatsApp tracking journeys</title>
<desc id="desc">Tagged website links sent in WhatsApp allow website measurement in GA4. Website chat buttons allow click measurement, while conversations and sales need messaging or CRM records.</desc>
<rect width="1200" height="580" rx="24" fill="#f3f8f7"/>
<g font-family="Arial, sans-serif" fill="#183238">
<text x="40" y="58" font-size="32" font-weight="700">Track the journey you actually measure</text>
<text x="40" y="113" font-size="24" font-weight="700">1. WhatsApp message → your website</text>
<rect x="40" y="138" width="315" height="118" rx="16" fill="#dcfce7" stroke="#86d7a3"/>
<text x="64" y="183" font-size="28" font-weight="700">Tagged website link</text>
<text x="64" y="223" font-size="23">Shared through WhatsApp</text>
<path d="M371 196h52m-12-10 12 10-12 10" fill="none" stroke="#238964" stroke-width="4"/>
<rect x="440" y="138" width="290" height="118" rx="16" fill="#fff" stroke="#b4c9c4"/>
<text x="464" y="183" font-size="28" font-weight="700">Your landing page</text>
<text x="464" y="223" font-size="23">GA4 tag collects activity</text>
<path d="M747 196h52m-12-10 12 10-12 10" fill="none" stroke="#238964" stroke-width="4"/>
<rect x="815" y="138" width="345" height="118" rx="16" fill="#e5f0ff" stroke="#abc9ec"/>
<text x="839" y="183" font-size="28" font-weight="700">Campaign reporting</text>
<text x="839" y="223" font-size="23">Collected website outcomes</text>
<text x="40" y="324" font-size="24" font-weight="700">2. Your website → WhatsApp chat</text>
<rect x="40" y="349" width="315" height="118" rx="16" fill="#fff" stroke="#b4c9c4"/>
<text x="64" y="394" font-size="28" font-weight="700">Website chat button</text>
<text x="64" y="434" font-size="23">GA4 records the interaction</text>
<path d="M371 407h52m-12-10 12 10-12 10" fill="none" stroke="#238964" stroke-width="4"/>
<rect x="440" y="349" width="290" height="118" rx="16" fill="#dcfce7" stroke="#86d7a3"/>
<text x="464" y="394" font-size="28" font-weight="700">WhatsApp opens</text>
<text x="464" y="434" font-size="23">A message may follow</text>
<path d="M747 407h52m-12-10 12 10-12 10" fill="none" stroke="#788b8e" stroke-width="4" stroke-dasharray="7 6"/>
<rect x="815" y="349" width="345" height="118" rx="16" fill="#fff4da" stroke="#e6c47a"/>
<text x="839" y="394" font-size="28" font-weight="700">Confirmed leads / sales</text>
<text x="839" y="434" font-size="23">Messaging and CRM records</text>
<text x="40" y="532" font-size="24">A button click alone does not confirm a sent message or a sale.</text>
</g></svg>
